<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Progress Table</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #6a737d;
    --line: #d8dee4;
    --head: #f3f5f7;
    --selected: #dbeafe;
    --hover: #f6f8fa;
    --drop: #2563eb;
    --ok: #1a7f37;
    --error: #cf222e;
    --open-bg: #fff4d6;
    --open-fg: #7a5200;
    --closed-bg: #e6f4ea;
    --closed-fg: #1a7f37;
  }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 12px "Segoe UI", Tahoma, Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
  }
  header, footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 10px;
    flex: none;
  }
  header { border-bottom: 1px solid var(--line); }
  footer { border-top: 1px solid var(--line); }
  #title {
    font-weight: 600;
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-right: 10px;
  }
  .mode {
    flex: none;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
  }
  .mode.open { background: var(--open-bg); color: var(--open-fg); }
  .mode.closed { background: var(--closed-bg); color: var(--closed-fg); }
  #list {
    flex: 1;
    overflow: auto;
  }
  #empty {
    padding: 24px 12px;
    color: var(--muted);
    text-align: center;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  th {
    background: var(--head);
    text-align: left;
    font-weight: 600;
    padding: 4px 6px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  td {
    padding: 2px 6px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  tbody tr:hover td { background: var(--hover); }
  tbody tr.selected td { background: var(--selected); }
  tbody tr.off td { color: var(--muted); }
  tbody tr.drop-before td { box-shadow: inset 0 2px 0 var(--drop); }
  tbody tr.drop-after td { box-shadow: inset 0 -2px 0 var(--drop); }
  td.order { width: 1%; }
  .handle {
    cursor: grab;
    color: var(--muted);
    padding: 0 4px 0 0;
    -webkit-user-select: none;
    user-select: none;
  }
  .position {
    display: inline-block;
    min-width: 26px;
    text-align: right;
    margin-right: 4px;
  }
  .arrow {
    font: inherit;
    font-size: 9px;
    width: 18px;
    height: 18px;
    padding: 0;
    margin: 0 1px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
  }
  .arrow:disabled { color: var(--line); cursor: default; }
  .swatch {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 1px solid #8c959f;
    border-radius: 3px;
    vertical-align: middle;
  }
  .swatch.none {
    background: repeating-linear-gradient(45deg, #ffffff 0, #ffffff 3px, #d0d7de 3px, #d0d7de 6px);
  }
  td.name { width: 100%; }
  .name-cell {
    display: flex;
    align-items: center;
  }
  .toggle {
    flex: none;
    width: 16px;
    color: var(--muted);
    cursor: pointer;
    text-align: center;
    -webkit-user-select: none;
    user-select: none;
  }
  .toggle.leaf { visibility: hidden; }
  tbody tr.nested td { font-weight: 600; }
  /* Levels: tree guides, a tint per depth, the rows being edited. */
  .tree {
    display: inline-flex;
    align-items: center;
    vertical-align: middle;
  }
  .guide {
    flex: none;
    font-family: Consolas, "Courier New", monospace;
    color: #8c959f;
    white-space: pre;
  }
  tbody tr.d1 td { background: #f8fafc; }
  tbody tr.d2 td { background: #f1f5f9; }
  tbody tr.d3 td { background: #e9eef4; }
  tbody tr.current td { background: var(--open-bg); }
  tbody tr.current:hover td { background: #ffecb3; }
  .badge {
    flex: none;
    font-size: 9px;
    font-weight: 700;
    padding: 0 4px;
    margin-right: 4px;
    border-radius: 3px;
    background: #2563eb;
    color: #ffffff;
  }
  #crumbs {
    padding: 4px 10px;
    border-bottom: 1px solid var(--line);
    background: var(--open-bg);
    color: var(--open-fg);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #crumbs .trail {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #crumbs a {
    color: var(--drop);
    cursor: pointer;
    text-decoration: underline;
  }
  #crumbs .here { font-weight: 600; }
  #close-all {
    flex: none;
    font: inherit;
    padding: 2px 8px;
    margin-left: 8px;
    cursor: pointer;
  }
  input.name {
    width: 100%;
    box-sizing: border-box;
    border: 1px solid transparent;
    border-radius: 3px;
    background: transparent;
    color: inherit;
    font: inherit;
    padding: 2px 4px;
  }
  input.name:hover, input.name:focus {
    border-color: var(--line);
    background: var(--bg);
    outline: none;
  }
  select {
    font: inherit;
    padding: 1px 2px;
  }
  .base {
    font-weight: 600;
    padding-left: 4px;
  }
  .state.ok { color: var(--ok); }
  .state.error { color: var(--error); font-weight: 600; }
  .state.off { color: var(--muted); }
  #formula {
    font-family: Consolas, "Courier New", monospace;
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-right: 10px;
  }
  #unions-first {
    flex: none;
    font: inherit;
    padding: 3px 10px;
    cursor: pointer;
  }
  .actions {
    flex: none;
    white-space: nowrap;
  }
  #finalize {
    margin-left: 6px;
    font: inherit;
    padding: 3px 10px;
    cursor: pointer;
  }
  #finalize:disabled { cursor: default; }
  #notice {
    flex: none;
    padding: 5px 10px;
    border-top: 1px solid var(--line);
    background: var(--open-bg);
    color: var(--open-fg);
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <header>
    <span id="title">Progress Table</span>
    <span id="mode" class="mode hidden"></span>
  </header>
  <div id="crumbs" class="hidden">
    <span class="trail" id="trail"></span>
    <button id="close-all" type="button" title="Close every open Solid Progress group (they are rebuilt, from the inside out)">⏏ Close</button>
  </div>
  <div id="list">
    <div id="empty">Select or open a Solid Progress group.</div>
    <table id="table" class="hidden">
      <thead>
        <tr>
          <th>#</th>
          <th title="Disabled volumes are ignored by the rebuild">On</th>
          <th>Color</th>
          <th>Name</th>
          <th>Operation</th>
          <th>State</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div id="notice" class="hidden"></div>
  <footer id="footer" class="hidden">
    <span id="formula" title="Operations computed, in order"></span>
    <span class="actions">
      <button id="unions-first" type="button" title="Every Union and Shell, then every Subtract, each in its current order">Unions first</button>
      <button id="finalize" type="button" title="Finalize Solid Progress — replace by a plain solid, without its sources (Ctrl+Z to undo)">Finalize</button>
    </span>
  </footer>

<script>
(function () {
  'use strict';

  // Written for the browser of SketchUp 2021 (no optional chaining, no
  // flex gap).
  var SYMBOLS = { union: '∪', outer_shell: 'shell', subtract: '−' };
  // 'base' is not an operation: it makes the row the first one.
  var OPERATIONS = [['base', 'Base'], ['union', 'Union'], ['outer_shell', 'Shell'], ['subtract', 'Subtract']];
  var data = null;
  // Row being dragged: it moves among the rows of its own group only.
  var dragRow = null;
  // Nested rows folded by the user (by row id), kept across refreshes.
  var collapsed = {};
  // True while the rows are replaced: the blur of a removed input is not
  // a rename.
  var rendering = false;

  function send(message) {
    if (window.sketchup && window.sketchup.action) {
      window.sketchup.action(JSON.stringify(message));
    }
  }

  // Keyboard back to SketchUp after an action, so that its shortcuts work
  // while the table is open; never while a name is typed or an operation
  // list is open.
  var releaseTimer = null;

  function busy() {
    var a = document.activeElement;
    return !!a && (a.tagName === 'SELECT' || (a.classList && a.classList.contains('name')));
  }

  function releaseSoon(delay, reason) {
    clearTimeout(releaseTimer);
    releaseTimer = setTimeout(function () {
      if (!busy()) send({ type: 'focus', reason: reason || 'action' });
    }, delay || 0);
  }

  // A new click in the table cancels a pending release (double-click).
  document.addEventListener('mousedown', function () { clearTimeout(releaseTimer); }, true);
  // The browser may report a mouseleave after a click while the pointer is
  // still in the window: only a real exit counts.
  document.documentElement.addEventListener('mouseleave', function (event) {
    var inside = event.clientX > 0 && event.clientY > 0 &&
                 event.clientX < window.innerWidth - 1 && event.clientY < window.innerHeight - 1;
    if (!inside) releaseSoon(0, 'mouse out');
  });

  function element(tag, className, text) {
    var e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  // Keys of the rows of +group+ (one level of the hierarchy), in order.
  function rowKeys(group) {
    return data.rows.filter(function (r) { return r.group === group; })
                    .map(function (r) { return r.key; });
  }

  function sendOrder(group, keys) {
    send({ type: 'order', group: group, keys: keys });
    releaseSoon(0);
  }

  // The base (row 1 of its level) never moves and no row goes above it.
  function move(row, delta) {
    var keys = rowKeys(row.group);
    var i = keys.indexOf(row.key);
    var j = i + delta;
    if (i < 1 || j < 1 || j >= keys.length) return;
    keys.splice(i, 1);
    keys.splice(j, 0, row.key);
    sendOrder(row.group, keys);
  }

  // (((1 ∪ 2) shell 3) − 4) ∪ 6 : enabled rows, in order; a nested group
  // is its own formula in parentheses: 1 ∪ (2.1 − 2.2).
  function formula(parent) {
    var active = data.rows.filter(function (r) { return r.parent === parent && r.enabled; });
    if (!active.length) return parent === null ? 'No enabled volume' : '∅';
    var term = function (r) { return r.nested ? '(' + formula(r.id) + ')' : r.label; };
    var expr = term(active[0]);
    for (var i = 1; i < active.length; i++) {
      if (i > 1) expr = '(' + expr + ')';
      expr += ' ' + SYMBOLS[active[i].op] + ' ' + term(active[i]);
    }
    return expr;
  }

  // ├ └ │ before the name: one column per level above the row.
  function guides(row, byId, counts) {
    if (!row.depth) return '';
    var last = function (r) { return r.position === counts[r.group]; };
    var text = last(row) ? '└─ ' : '├─ ';
    for (var p = byId[row.parent]; p && p.depth > 0; p = byId[p.parent]) {
      text = (last(p) ? '    ' : '│   ') + text;
    }
    return text;
  }

  // A row is hidden when a nested row above it is folded.
  function folded(row, byId) {
    for (var p = row.parent; p; p = byId[p].parent) {
      if (collapsed[p]) return true;
    }
    return false;
  }

  function clearDrop() {
    var marked = document.querySelectorAll('.drop-before, .drop-after');
    for (var i = 0; i < marked.length; i++) {
      marked[i].classList.remove('drop-before', 'drop-after');
    }
  }

  function dropAfter(tr, event) {
    var box = tr.getBoundingClientRect();
    return event.clientY > box.top + box.height / 2;
  }

  function buildRow(row, index, count, inputs, guide) {
    var tr = element('tr');
    if (row.selected) tr.classList.add('selected');
    if (!row.enabled) tr.classList.add('off');
    if (row.nested) tr.classList.add('nested');
    if (row.depth) tr.classList.add('d' + Math.min(row.depth, 3));
    if (row.current) tr.classList.add('current');

    // # : drag handle, position, up / down; the base row is fixed.
    var order = element('td', 'order');
    var handle = element('span', 'handle', '⋮⋮');
    if (row.base) {
      handle.style.visibility = 'hidden';
    } else {
      handle.title = 'Drag to reorder';
      handle.addEventListener('mousedown', function () { tr.draggable = true; });
    }
    order.appendChild(handle);
    // The tree: guides of the levels above, fold toggle, number.
    var tree = element('span', 'tree');
    if (guide) tree.appendChild(element('span', 'guide', guide));
    var toggle = element('span', row.nested ? 'toggle' : 'toggle leaf', collapsed[row.id] ? '▸' : '▾');
    if (row.nested) {
      toggle.title = collapsed[row.id] ? 'Show the volumes of this Solid Progress group'
                                       : 'Hide the volumes of this Solid Progress group';
      toggle.addEventListener('click', function (event) {
        event.stopPropagation();
        collapsed[row.id] = !collapsed[row.id];
        render();
      });
    }
    tree.appendChild(toggle);
    tree.appendChild(element('span', 'position', row.label));
    order.appendChild(tree);
    var up = element('button', 'arrow', '▲');
    up.type = 'button';
    up.title = 'Move up';
    up.disabled = index <= 1;
    up.addEventListener('click', function () { move(row, -1); });
    var down = element('button', 'arrow', '▼');
    down.type = 'button';
    down.title = 'Move down';
    down.disabled = index === 0 || index === count - 1;
    down.addEventListener('click', function () { move(row, 1); });
    if (row.base) {
      up.style.visibility = 'hidden';
      down.style.visibility = 'hidden';
    }
    order.appendChild(up);
    order.appendChild(down);
    tr.appendChild(order);

    // On: the base is always enabled.
    var on = element('td');
    var box = element('input');
    box.type = 'checkbox';
    box.checked = row.enabled;
    if (row.base && row.enabled) {
      box.disabled = true;
      box.title = 'The base is always enabled';
    }
    box.addEventListener('change', function () {
      send({ type: 'toggle', group: row.group, key: row.key, on: box.checked });
      releaseSoon(0);
    });
    on.appendChild(box);
    tr.appendChild(on);

    // Color
    var color = element('td');
    var swatch = element('span', row.color ? 'swatch' : 'swatch none');
    if (row.color) swatch.style.background = row.color;
    swatch.title = row.color ? row.color : 'Default material';
    color.appendChild(swatch);
    tr.appendChild(color);

    // Name
    var name = element('td', 'name');
    var cell = element('div', 'name-cell');
    if (row.nested) {
      var badge = element('span', 'badge', 'SP');
      badge.title = 'Solid Progress group: its Result is used here';
      cell.appendChild(badge);
    }
    var input = element('input', 'name');
    input.type = 'text';
    input.value = row.name;
    input.placeholder = row.placeholder;
    input.spellcheck = false;
    // Enter or Escape also gives the keyboard back to SketchUp; a click
    // elsewhere does not (the click itself decides).
    var validated = false;
    input.addEventListener('keydown', function (event) {
      // keyCode: browser of SketchUp 2017.
      var key = event.key || event.keyCode;
      if (key === 'Enter' || key === 13) {
        validated = true;
        input.blur();
      } else if (key === 'Escape' || key === 'Esc' || key === 27) {
        validated = true;
        input.value = row.name;
        input.blur();
      }
    });
    // Enter, Tab or a click elsewhere renames the volume.
    input.addEventListener('blur', function () {
      if (rendering) return;
      if (input.value.trim() !== row.name) {
        send({ type: 'rename', group: row.group, key: row.key, name: input.value });
      }
      if (validated) releaseSoon(0, 'name');
      validated = false;
    });
    inputs[row.id] = input;
    cell.appendChild(input);
    name.appendChild(cell);
    tr.appendChild(name);

    // Operation: the first row is the base; choosing Base on another row
    // makes it the first one.
    var operation = element('td');
    if (row.base && row.op !== 'subtract') {
      var label = element('span', 'base', 'Base');
      label.title = 'To change the base, choose Base on another row';
      operation.appendChild(label);
    } else {
      var select = element('select');
      OPERATIONS.forEach(function (o) {
        var option = element('option', null, o[1]);
        option.value = o[0];
        select.appendChild(option);
      });
      select.value = row.op;
      select.addEventListener('change', function () {
        if (select.value === 'base') {
          send({ type: 'base', group: row.group, key: row.key });
        } else {
          send({ type: 'op', group: row.group, key: row.key, op: select.value });
        }
        select.blur();
        releaseSoon(0);
      });
      operation.appendChild(select);
    }
    tr.appendChild(operation);

    // State
    tr.appendChild(element('td', 'state ' + row.level, row.state));

    // Selection in the model. The keyboard goes back to SketchUp a little
    // later after a click, so that a double-click still reaches the table.
    tr.addEventListener('click', function (event) {
      if (event.target.closest('input, select, button')) return;
      send({ type: 'select', group: row.group, key: row.key });
      releaseSoon(600, 'row click');
    });
    tr.addEventListener('dblclick', function (event) {
      if (event.target.closest('input, select, button')) return;
      send({ type: 'open', group: row.group, key: row.key });
      releaseSoon(0, 'double-click');
    });

    // Drag and drop, started from the handle only.
    tr.addEventListener('dragstart', function (event) {
      dragRow = row;
      event.dataTransfer.effectAllowed = 'move';
      event.dataTransfer.setData('text/plain', row.key);
    });
    tr.addEventListener('dragend', function () {
      tr.draggable = false;
      dragRow = null;
      clearDrop();
    });
    // Nothing goes above the base: a drop on it lands after it.
    tr.addEventListener('dragover', function (event) {
      if (!dragRow || dragRow.id === row.id || dragRow.group !== row.group) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = 'move';
      var after = row.base || dropAfter(tr, event);
      tr.classList.toggle('drop-after', after);
      tr.classList.toggle('drop-before', !after);
    });
    tr.addEventListener('dragleave', function () {
      tr.classList.remove('drop-before', 'drop-after');
    });
    tr.addEventListener('drop', function (event) {
      event.preventDefault();
      if (!dragRow || dragRow.id === row.id || dragRow.group !== row.group) return;
      var moved = dragRow.key;
      var keys = rowKeys(row.group).filter(function (k) { return k !== moved; });
      var target = keys.indexOf(row.key) + (row.base || dropAfter(tr, event) ? 1 : 0);
      keys.splice(target, 0, moved);
      dragRow = null;
      clearDrop();
      sendOrder(row.group, keys);
    });
    return tr;
  }

  function render() {
    var title = document.getElementById('title');
    var mode = document.getElementById('mode');
    var empty = document.getElementById('empty');
    var table = document.getElementById('table');
    var footer = document.getElementById('footer');
    var notice = document.getElementById('notice');

    // Message of the last action, until the next one.
    notice.textContent = (data && data.notice) || '';
    notice.classList.toggle('hidden', !(data && data.notice));

    if (!data || !data.group) {
      title.textContent = 'Progress Table';
      mode.classList.add('hidden');
      document.getElementById('crumbs').classList.add('hidden');
      table.classList.add('hidden');
      footer.classList.add('hidden');
      empty.textContent = data ? data.message : 'Select or open a Solid Progress group.';
      empty.classList.remove('hidden');
      return;
    }

    // A name being typed survives the refresh.
    var focused = document.activeElement;
    var keep = null;
    if (focused && focused.classList.contains('name') && focused.dataset.key) {
      keep = { key: focused.dataset.key, value: focused.value,
               start: focused.selectionStart, end: focused.selectionEnd };
    }

    title.textContent = data.name;
    mode.textContent = data.open ? 'Open: ' + data.current + ' — applied on exit' : 'Closed — applied now';
    renderCrumbs();
    mode.className = 'mode ' + (data.open ? 'open' : 'closed');
    empty.classList.add('hidden');
    table.classList.remove('hidden');
    footer.classList.remove('hidden');

    var tbody = document.getElementById('rows');
    var inputs = {};
    var fragment = document.createDocumentFragment();
    var byId = {};
    var counts = {};
    data.rows.forEach(function (row) {
      byId[row.id] = row;
      counts[row.group] = (counts[row.group] || 0) + 1;
    });
    data.rows.forEach(function (row) {
      if (row.in_path) delete collapsed[row.id];
    });
    data.rows.forEach(function (row) {
      if (folded(row, byId)) return;
      fragment.appendChild(buildRow(row, row.position - 1, counts[row.group], inputs, guides(row, byId, counts)));
    });
    Object.keys(inputs).forEach(function (key) { inputs[key].dataset.key = key; });
    rendering = true;
    tbody.innerHTML = '';
    tbody.appendChild(fragment);
    if (!data.rows.length) {
      empty.textContent = 'This Solid Progress group has no volume.';
      empty.classList.remove('hidden');
    }
    document.getElementById('formula').textContent = formula(null);
    // Finalize works on a closed procedural solid only (SketchUp 2017
    // cannot close it from a plugin).
    var finalize = document.getElementById('finalize');
    finalize.disabled = !!data.open;
    finalize.title = data.open ? 'Close the Solid Progress group to finalize it'
                               : 'Finalize Solid Progress — replace by a plain solid, without its sources (Ctrl+Z to undo)';

    if (keep && inputs[keep.key]) {
      var input = inputs[keep.key];
      input.value = keep.value;
      input.focus();
      input.setSelectionRange(keep.start, keep.end);
    }
    rendering = false;
  }

  // Open Solid Progress groups, outermost first: a click on one closes the
  // groups opened inside it.
  function renderCrumbs() {
    var crumbs = document.getElementById('crumbs');
    var trail = document.getElementById('trail');
    var path = (data && data.path) || [];
    crumbs.classList.toggle('hidden', !path.length);
    trail.innerHTML = '';
    path.forEach(function (step, i) {
      if (i) trail.appendChild(document.createTextNode(' › '));
      if (i === path.length - 1) {
        trail.appendChild(element('span', 'here', step.name));
      } else {
        var link = element('a', null, step.name);
        link.title = 'Go back to this level (the groups inside it are closed and rebuilt)';
        link.addEventListener('click', function () {
          send({ type: 'close_to', group: step.group });
          releaseSoon(0);
        });
        trail.appendChild(link);
      }
    });
  }

  document.getElementById('close-all').addEventListener('click', function () {
    if (data && data.group) send({ type: 'close_all', group: data.group });
    releaseSoon(0);
  });

  window.SolidProcedural = {
    update: function (payload) {
      data = payload;
      render();
    }
  };

  document.getElementById('unions-first').addEventListener('click', function () {
    if (data && data.group) send({ type: 'unions_first', group: data.group });
    releaseSoon(0);
  });

  document.getElementById('finalize').addEventListener('click', function () {
    if (data && data.group && !data.open) send({ type: 'finalize', group: data.group });
    releaseSoon(0);
  });

  // The shortcuts work as soon as the table is open.
  document.addEventListener('DOMContentLoaded', function () {
    send({ type: 'ready' });
    releaseSoon(0, 'open');
  });
}());
</script>
</body>
</html>
